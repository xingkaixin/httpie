[tools]
go = "1.27.2"

[tasks.build]
description = "Build the three CLI commands"
run = "go build -trimpath -o bin/ ./cmd/..."

[tasks.test]
description = "Run behavior tests"
run = "go test ./..."

[tasks.check]
description = "Check formatting, static analysis and race safety"
run = "test -z \"$(gofmt -l cmd internal)\" && go vet ./... && go test -race ./..."

[tasks.parity]
description = "Compare the Go CLI with the supplied Python baseline"
depends = ["build"]
run = "python3 scripts/parity.py"

[tasks.bench]
description = "Measure CLI latency and peak RSS"
depends = ["build"]
run = "python3 scripts/benchmark.py"
