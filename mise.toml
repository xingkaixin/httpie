[tools]
go = "1.27.3"

[env]
CGO_ENABLED = "1"

[tasks.build]
description = "Build the three CLI commands"
run = "go build -trimpath -o bin/ ./cmd/http ./cmd/https ./cmd/httpie"

[tasks.dev]
description = "Run the desktop app with live reload"
run = "go tool mygo dev"

[tasks.install]
description = "Build and install CLI commands"
depends = ["build"]
run = """
mkdir -p "$HOME/.local/bin"
install -m 755 bin/http bin/https bin/httpie "$HOME/.local/bin/"
"""

[tasks.test]
description = "Run behavior tests"
run = "go test ./..."

[tasks.check]
description = "Check formatting, static analysis and race safety"
run = "test -z \"$(gofmt -l cmd internal)\" && go vet ./... && go tool mygo vet ./cmd/httpdesk && go test -race ./..."

[tasks.parity]
description = "Compare the Go CLI with the supplied Python baseline"
depends = ["build"]
run = "python3 scripts/parity.py && python3 scripts/state-parity.py"

[tasks.bench]
description = "Measure CLI latency and peak RSS"
depends = ["build"]
run = "python3 scripts/benchmark.py"

[settings]
idiomatic_version_file_ignore_minimum_versions = true
